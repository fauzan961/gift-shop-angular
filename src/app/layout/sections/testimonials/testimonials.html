<section class="testimonials-section">
  <div class="testimonials-band">
    <!-- Decorative glows -->
    <span class="glow glow-one" aria-hidden="true"></span>
    <span class="glow glow-two" aria-hidden="true"></span>

    <!-- Heading -->
    <div class="band-header">
      <span class="band-eyebrow">Loved by gifters</span>
      <h2 class="band-title">Happy tears, delivered daily 💝</h2>
      <p class="band-subtitle">
        Thousands of celebrations later, here is what our customers keep telling us.
      </p>
    </div>

    <!-- Testimonial Cards -->
    <div class="testimonial-grid">
      @for (item of testimonials; track item.name) {
        <figure class="testimonial-card">
          <div class="stars" [attr.aria-label]="item.rating + ' out of 5 stars'">
            @for (star of stars; track star) {
              <svg width="16" height="16" viewBox="0 0 24 24" [class.dim]="star > item.rating" aria-hidden="true">
                <path d="M12 2l2.9 6.26 6.6.72-4.95 4.6 1.36 6.42L12 16.8l-5.91 3.2 1.36-6.42L2.5 8.98l6.6-.72z"/>
              </svg>
            }
          </div>

          <blockquote class="quote">"{{ item.quote }}"</blockquote>

          <figcaption class="author">
            <span class="avatar">{{ item.initials }}</span>
            <span class="author-meta">
              <span class="author-name">{{ item.name }}</span>
              <span class="author-location">{{ item.location }}</span>
            </span>
          </figcaption>
        </figure>
      }
    </div>

    <!-- Stats Strip -->
    <div class="stats-strip">
      @for (stat of stats; track stat.label) {
        <div class="stat">
          <span class="stat-value">{{ stat.value }}</span>
          <span class="stat-label">{{ stat.label }}</span>
        </div>
      }
    </div>
  </div>
</section>
