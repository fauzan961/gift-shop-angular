<section class="categories-section">
  <!-- Section Header -->
  <div class="categories-header">
    <div>
      <span class="eyebrow">Browse the collection</span>
      <h2 class="section-title">Gift by Category 🛍️</h2>
    </div>
    <button type="button" class="view-all-btn" (click)="onCategoryClick()">
      Browse all
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Category Cards -->
  <div class="categories-grid">
    @for (category of categories; track category.name) {
      <button type="button" [class]="'category-card ' + category.theme" (click)="onCategoryClick()">
        <span class="card-blob" aria-hidden="true"></span>

        <span class="medallion">
          <img [src]="category.image" [alt]="category.name" />
        </span>

        <span class="card-text">
          <span class="card-name">{{ category.name }}</span>
          <span class="card-count">{{ category.count }}</span>
        </span>

        <span class="card-arrow" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
    }
  </div>
</section>
