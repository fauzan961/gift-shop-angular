<div class="max-w-[1400px] mx-auto px-3 sm:px-5 pt-24">
  <!-- Hero Banner -->
  <div class="relative rounded-3xl overflow-hidden shadow-xl min-h-[260px] sm:min-h-[350px] lg:min-h-[400px]">
    <!-- Background Image (Full Banner) -->
    <div class="absolute inset-0">
      <img 
        src="../../../assets/images/banner.webp" 
        alt="Gift with flowers and cake" 
        class="w-full h-full object-cover object-center"
      />
      <!-- Gradient Overlay for text readability -->
      <div class="absolute inset-0 bg-gradient-to-r from-[#3A0D2E]/90 via-[#3A0D2E]/50 to-transparent"></div>
    </div>

    <!-- Content Positioned Over Image -->
    <div class="relative z-10 h-full min-h-[260px] sm:min-h-[350px] lg:min-h-[400px] flex items-end">
      <div class="p-8 sm:p-12 lg:p-16 pb-12">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold text-white mb-6 leading-tight">
          Surprise Your<br>Loved Ones
        </h1>
        <button class="bg-purple-600/80 hover:bg-purple-700 text-white font-semibold text-lg px-8 py-4 rounded-full transition-all duration-300 hover:scale-105 shadow-lg">
          Shop now
        </button>
      </div>
    </div>
  </div>

  <!-- Trending Gifts Section -->
   <app-gifts-carousel [title]="'Trending Gifts 🎁'"></app-gifts-carousel>
  <!-- New Arrival Gifts Section -->
   <app-gifts-carousel [title]="'New Arrivals ✨'" ></app-gifts-carousel>
   <!-- Categories Section -->
<section class="mt-12 pb-12">
  <h2 class="section-title mb-6">Shop by Category 🛍️</h2>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 sm:gap-6">
    <!-- Category Card 1 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=400&q=80" alt="Flowers" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
    <!-- Category Card 2 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=400&q=80" alt="Cakes" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
    <!-- Category Card 3 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1606813904823-2f45f1c75b5a?auto=format&fit=crop&w=400&q=80" alt="Gifts" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
    <!-- Category Card 4 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1590080879339-b9f2d5e31a96?auto=format&fit=crop&w=400&q=80" alt="Chocolates" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
    <!-- Category Card 5 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1611557769110-2b0f21e78c23?auto=format&fit=crop&w=400&q=80" alt="Toys" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
    <!-- Category Card 6 -->
    <div class="category-card rounded-2xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition-transform">
      <img src="https://images.unsplash.com/photo-1611078483818-47b72f9e403b?auto=format&fit=crop&w=400&q=80" alt="Accessories" class="w-full h-32 sm:h-36 object-cover"/>
    </div>
  </div>
</section>

</div>
