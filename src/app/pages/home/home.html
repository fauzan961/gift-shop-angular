<div class="max-w-[1400px] mx-auto px-3 sm:px-5 pt-24">
  <!-- Hero Banner -->
  <section class="hero">
    <span class="hero-glow hero-glow-a" aria-hidden="true"></span>
    <span class="hero-glow hero-glow-b" aria-hidden="true"></span>

    <div class="hero-inner">
      <!-- Copy -->
      <div class="hero-content">
        <span class="hero-pill">
          <span class="pulse-dot" aria-hidden="true"></span>
          Same-day delivery across Kuwait
        </span>

        <h1 class="hero-title">
          Surprise your
          <span class="hero-accent">loved ones</span>
        </h1>

        <p class="hero-sub">
          Hand-tied blooms, fresh-baked cakes and hand-picked keepsakes — wrapped
          beautifully and delivered to their door in hours.
        </p>

        <div class="hero-actions">
          <button type="button" class="hero-btn-primary" (click)="onShopClick()">
            Shop now
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button type="button" class="hero-btn-ghost" (click)="onOccasionClick()">
            Browse occasions
          </button>
        </div>

        <div class="hero-trust">
          <span class="trust-avatars" aria-hidden="true">
            <span class="trust-avatar">LA</span>
            <span class="trust-avatar">OH</span>
            <span class="trust-avatar">SM</span>
          </span>
          <span class="trust-text">
            <strong>12,000+</strong> happy gifters
            <span class="trust-rating">
              <span class="trust-stars" aria-hidden="true">
                @for (star of heroStars; track star) {
                  <svg width="12" height="12" viewBox="0 0 24 24">
                    <path d="M12 2l2.9 6.26 6.6.72-4.95 4.6 1.36 6.42L12 16.8l-5.91 3.2 1.36-6.42L2.5 8.98l6.6-.72z"/>
                  </svg>
                }
              </span>
              4.9
            </span>
          </span>
        </div>
      </div>

      <!-- Product collage -->
      <div class="hero-collage">
        <figure class="collage-card card-main">
          <img src="/assets/images/flowers.jpg" alt="Red rose bouquet" />
        </figure>
        <figure class="collage-card card-top">
          <img src="/assets/images/cake.jpg" alt="Celebration cake" />
        </figure>
        <figure class="collage-card card-bottom">
          <img src="/assets/images/pendant.webp" alt="Heart pendant necklace" />
        </figure>

        <span class="float-chip chip-delivery">🚚 2-hour delivery</span>
        <span class="float-chip chip-wrap">🎀 Free gift wrap</span>
      </div>
    </div>
  </section>

  <!-- Trending Gifts Section -->
   <app-gifts-carousel
     [eyebrow]="'Most loved right now'"
     [title]="'Trending Gifts 🎁'"></app-gifts-carousel>

  <!-- Shop by Occasion Section -->
   <app-occasions></app-occasions>

  <!-- New Arrival Gifts Section -->
   <app-gifts-carousel
     [eyebrow]="'Fresh in this week'"
     [title]="'New Arrivals ✨'"
     [gifts]="newArrivals"></app-gifts-carousel>
   <!-- Categories Section -->
    <app-categories></app-categories>

   <!-- Testimonials & Stats Section -->
    <app-testimonials></app-testimonials>
</div>
